- name: Update Vote Count
        run: |
          CHOICE="${{ github.event.client_payload.choice }}"
          MOTIVE="${{ github.event.client_payload.motive }}"
          echo "Vote received for: $CHOICE, Rationale: $MOTIVE"
          
          # Use node to log the vote AND the reason securely
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('votes.json', 'utf8'));
            if (data[CHOICE] !== undefined) {
              data[CHOICE] += 1;
              // Now add the reason to a separate object within the JSON
              if (!data.vote_logs) data.vote_logs = []; 
              data.vote_logs.push({ choice: CHOICE, reason: MOTIVE, timestamp: new Date() });
              fs.writeFileSync('votes.json', JSON.stringify(data, null, 2));
            } else { process.exit(1); }
          "
